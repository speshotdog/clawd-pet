<script>
'use strict';
const q=new URLSearchParams(location.search),$=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const sections=['後院草地・廢墟','補給線','夜市攤・廢墟','冷藏庫深處','滅世都市'],bosses=['灰狼犬','貼紙羊','扛槌兔','雞頭合成怪','真・滅世珍獸'],mechanics=['召喚小怪','護盾層','節奏','順序','前四種輪播'];

let progress=Math.max(0,Math.min(20,Math.floor(finite(q.get('progress'),0)))),selected=Math.min(progress,19),busy=false;
let mapGeneration=0;

function remaining(i){return Math.max(0,Math.ceil(((cooldowns[i]||0)-Date.now())/1000))}function time(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

stages.forEach(s=>{if(s.i%4===0){const t=document.createElement('div');t.className='segment-note';t.style.setProperty('--y',`${s.i*144+18}px`);t.textContent=`0${s.segment+1} / ${sections[s.segment]}`;$('.route').append(t)}const b=document.createElement('button');b.className='station'+(s.boss?' boss':'');b.style.setProperty('--dx',`${s.i%2*36}px`);b.style.setProperty('--y',`${s.i*144+70}px`);b.dataset.index=s.i;b.innerHTML=`<span class="node-body">${s.boss?'<span class="gate motif" aria-hidden="true"></span>':''}<span class="symbol"></span></span><svg class="bracket" viewBox="0 0 68 68" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18V8L8 0H18M50 0H60L68 8V18M68 50V60L60 68H50M18 68H8L0 60V50"/></svg><span class="station-label"></span>`;b.onclick=()=>{selected=s.i;details()};$('.route').append(b)});

function lines(){const route=$('.route').getBoundingClientRect();$('.route-lines').innerHTML=stages.slice(0,19).map((s,i)=>{const a=all('.station')[i].getBoundingClientRect(),b=all('.station')[i+1].getBoundingClientRect();return `<path class="link ${i<progress?'walked':''}" data-from="${i}" data-to="${i+1}" d="M${a.x+a.width/2-route.x} ${i*144+100} L${b.x+b.width/2-route.x} ${(i+1)*144+100}"/>`}).join('')}

function details(){const s=stages[selected],r=remaining(selected);$('#section').textContent=`第 ${s.segment+1} 段 / ${sections[s.segment]}`;$('#title').textContent=s.name;$('#status').textContent=selected<progress?'已通關 · 路線保留':selected>progress?'未解鎖 · 先通過前一站':r?'王關冷卻中':'目前位置 · 可記錄結果';$('#description').textContent=s.boss?`王關機制：${mechanics[s.segment]}`:selected%4===2?omens[s.segment]:'一般關 · 放置／點擊';$('#description').classList.toggle('foreshadow',selected%4===2);$('#next').textContent=progress===20?'全線已通行。可選取任一站檢視記錄。':selected>progress?`下一步：先通過「${stages[selected-1].name}」。`:r?'下一步：冷卻結束後重試；可先檢視路線。':'地圖預覽：記錄結果以檢視下一站狀態。';$('#advance').hidden=$('#fail').hidden=selected!==progress||progress===20;$('#advance').disabled=$('#fail').disabled=busy||r>0;all('nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===s.segment)))}
function tick(){if(document.body.dataset.screen==='team')return;all('[data-boss]').forEach(e=>{let n=remaining(+e.dataset.boss);e.textContent=n?`冷卻 ${time(n)}`:''});if(!busy)details()}
function animate(el,frames,duration,id,delay=0){let a=el.animate(frames,{duration,delay,fill:'both',easing:'linear'});a.id=id;return a}
async function ensureVisible(i){if(reduced())return;const token=mapGeneration;const w=$('.map-window'),r=w.getBoundingClientRect(),n=all('.station')[i].getBoundingClientRect();if(n.top-8>=r.top&&n.bottom+8<=r.bottom)return;const start=w.scrollTop,delta=Math.sign(n.top-r.top)*Math.min(innerHeight*.28,Math.max(innerHeight*.12,n.bottom+12-r.bottom));const proxy=document.createElement('span');w.append(proxy);let a=animate(proxy,[{opacity:0},{opacity:1}],330,'camera');const frame=()=>{if(token!==mapGeneration)return;w.scrollTop=start+delta*Math.min(1,(a.currentTime||0)/330);if(a.playState!=='finished')requestAnimationFrame(frame)};requestAnimationFrame(frame);try{await a.finished;if(token===mapGeneration)w.scrollTop=start+delta}catch{}finally{proxy.remove()}}
async function advance(){if(busy||progress>=20||remaining(progress))return;const token=mapGeneration;busy=true;details();let i=progress,b=all('.station')[i],ds=reduced()?[130,130,130]:[140,280,190];b.querySelector('.symbol').innerHTML=svg('check','<path d="m3 12 6 6L21 5"/>');const check=animate(b.querySelector('.check'),[{opacity:0},{opacity:1}],ds[0],'check');const link=all('.link')[i];let fill;if(link){const len=link.getTotalLength();fill=animate(link,[{strokeDasharray:`${len}`,strokeDashoffset:len,strokeOpacity:.84},{strokeDasharray:`${len}`,strokeDashoffset:0,strokeOpacity:.84}],ds[1],'connection',ds[0])}const next=all('.station')[i+1];let bracket;if(next){next.querySelector('.bracket').style.display='block';bracket=animate(next.querySelector('.bracket'),[{opacity:0},{opacity:1}],ds[2],'bracket',ds[0]+(link?ds[1]:0))}try{await Promise.all([check,fill,bracket].filter(Boolean).map(a=>a.finished))}catch{return}if(token!==mapGeneration)return;[check,fill,bracket].filter(Boolean).forEach(a=>a.cancel());if(next)next.querySelector('.bracket').style.display='';progress++;selected=Math.min(progress,19);busy=false;render();if(progress<20)await ensureVisible(progress)}
$('#advance').onclick=advance;$('#fail').onclick=()=>{if(selected!==progress||busy||remaining(progress))return;if(stages[progress].boss)cooldowns[progress]=Date.now()+180000;tick();if(!stages[progress].boss)$('#next').textContent='未通過。可立即重試，通關後才開放下一站。'};$('#back').onclick=()=>{selected=Math.min(progress,19);details();$('.map-window').scrollTop=Math.max(0,selected*144-144)};

all('.wear').forEach((e,i)=>{const horizontal=e.closest('.mast')||e.classList.contains('wear-foot');e.innerHTML=horizontal?`<svg preserveAspectRatio="none" viewBox="0 0 1000 16"><path d="M0 2H73l9 2h42l8-2h36l5 3h24M209 1h18m7 2h11M293 2h89l13 3h44M507 1h16m27 2h67M718 2h51l8 3h35M907 2h93M2 5v8m994-9v9"/></svg>`:`<svg preserveAspectRatio="none" viewBox="0 0 18 700"><path d="M2 0v83l3 7v29M1 153v17m3 11v9M2 246v59l3 9v42M1 443v17m3 11v31M2 584v73l3 9v34M5 2h10M5 695h12"/></svg>`});

const detailBase=details;
details=function(){detailBase();const s=stages[selected];$('#section').textContent=`第 ${s.segment+1} 段 / 5 · ${sections[s.segment]}`;$('#art-note').textContent=s.segment?'地景佔位：沿用第一段後院美術':'第一段地景 · 後院草地・廢墟'};

// Rest the viewport in a gap between node bodies. During a user's scroll the
// artwork and nodes move together; at scrollend no body straddles an edge.
function settleScroll(){
 const w=$('.map-window'),h=w.clientHeight,start=w.scrollTop,max=w.scrollHeight-h;
 const top=innerWidth<700?0:70;
 const fits=s=>stages.every((n)=>{const a=n.i*144+70-s,b=a+60;return b<=top-1||a>=h+1||(a>=top+1&&b<=h-1)});
 for(let d=0;d<=120;d++)for(const s of [start+d,start-d])if(s>=0&&s<=max&&fits(s)){w.scrollTop=s;return}
}
let cameraRunning=false;
$('.map-window').addEventListener('scrollend',()=>{if(!cameraRunning)settleScroll()});
const ensureVisibleBase=ensureVisible;
ensureVisible=async function(i){cameraRunning=true;try{await ensureVisibleBase(i)}finally{cameraRunning=false;if(!reduced()&&document.body.dataset.screen!=='team')settleScroll()}};
map20.ensureVisible=ensureVisible;
if(innerWidth<700)$('.map-window').scrollTop=Math.floor(Math.min(progress,19)/4)*576;
settleScroll();
// A narrow viewport surveys both edges during the segment's scroll travel.
// No bitmap edits, scaling, or vertical drift relative to the route.
function surveyTerrain(){
 const w=$('.map-window'),s=w.scrollTop%576;
 const pan=innerWidth<700?(s<60?46*Math.sin(Math.PI*s/60):s<330?-46*Math.sin(Math.PI*(s-60)/270):0):0;
 $('.terrain').style.setProperty('--terrain-pan',pan+'px');
}
$('.map-window').addEventListener('scroll',surveyTerrain,{passive:true});
surveyTerrain();
