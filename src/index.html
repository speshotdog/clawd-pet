<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>HotDog</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage" class="idle">
    <div id="bubble"></div>
    <div id="workbar"><div id="workfill"></div></div>
    <div id="workcount"></div>
    <div id="sweat">💦</div>
    <div id="zzz">z<span>z</span></div>
    <!-- 角色由 pet.js 依 localStorage 的 petchar 從下方 template 實例化 -->
  </div>

  <!-- ================= 角色：熱狗狗狗（PNG 拆件） ================= -->
  <template id="char-dog">
    <svg id="pet" viewBox="0 0 311 346" xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         stroke-linejoin="round" stroke-linecap="round">
      <defs>
        <!-- 腿的存根頂部是平切直邊，旋轉時直角會戳出身體輪廓（膝蓋刺刺感）；
             用圓角裁切把直角修圓（裁切跟著腿一起旋轉，超界時只露圓肩不露尖角） -->
        <clipPath id="clipLegL"><rect x="60" y="306" width="66" height="70" rx="14" /></clipPath>
        <clipPath id="clipLegR"><rect x="138" y="306" width="62" height="70" rx="14" /></clipPath>
      </defs>
      <ellipse id="shadow" cx="155" cy="338" rx="100" ry="9" />
      <g id="root">
        <g id="body">
          <!-- 四肢（畫在身體後面，關節藏進輪廓裡，可獨立旋轉） -->
          <g id="legL"><image href="legL.png" x="0" y="0" width="311" height="346" clip-path="url(#clipLegL)" /></g>
          <g id="legR"><image href="legR.png" x="0" y="0" width="311" height="346" clip-path="url(#clipLegR)" /></g>
          <g id="pawR"><image href="pawR.png" x="0" y="0" width="311" height="346" /></g>
          <!-- 原圖本體（去背+去白邊，四肢已拆出） -->
          <image href="body.png" x="0" y="0" width="311" height="346" />
          <!-- 蓋住原圖畫死的眼睛（取樣自周圍底色；不隨視線移動） -->
          <ellipse cx="95" cy="103" rx="15" ry="19" fill="#E6CD98" />
          <ellipse cx="133" cy="107" rx="14.5" ry="19.5" fill="#E6CD98" />
          <!-- 臉（可動圖層） -->
          <g id="face">
            <g id="eyes-open">
              <g class="eye"><ellipse cx="95" cy="103" rx="10" ry="14" fill="#000" transform="rotate(10 95 103)" /></g>
              <g class="eye"><ellipse cx="133" cy="107" rx="9.5" ry="14.5" fill="#000" transform="rotate(10 133 107)" /></g>
            </g>
            <g id="eyes-happy">
              <path d="M84 107 Q95 94 106 107" />
              <path d="M122 111 Q133 98 144 111" />
            </g>
            <g id="eyes-closed">
              <path d="M85 104 Q95 112 105 104" />
              <path d="M123 108 Q133 116 143 108" />
            </g>
          </g>
        </g>
      </g>
    </svg>
  </template>

  <!-- ================= 角色：女僕狐狐（image.png 直接拆件，同狗狗工法） ================= -->
  <template id="char-fox">
    <svg id="pet" viewBox="61 94 495 467" xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         stroke-linejoin="round" stroke-linecap="round">
      <defs>
        <!-- 切割邊是直邊，旋轉時直角會露出毛刺；圓角裁切跟著部件轉，只露圓肩 -->
        <clipPath id="clipFoxLegL"><rect x="228" y="493" width="70" height="64" rx="13" /></clipPath>
        <clipPath id="clipFoxLegR"><rect x="336" y="493" width="70" height="62" rx="13" /></clipPath>
        <clipPath id="clipFoxArm"><rect x="66" y="248" width="192" height="220" rx="18" /></clipPath>
        <clipPath id="clipFoxTail"><rect x="432" y="348" width="118" height="210" rx="18" /></clipPath>
      </defs>
      <ellipse id="shadow" cx="308" cy="550" rx="150" ry="9" />
      <g id="root">
        <g id="body">
          <!-- 部件（畫在身體後面，切割縫藏在輪廓／暗色交界裡） -->
          <g id="tail"><image href="fox-tail.png" x="0" y="0" width="635" height="618" clip-path="url(#clipFoxTail)" /></g>
          <g id="legL"><image href="fox-legL.png" x="0" y="0" width="635" height="618" clip-path="url(#clipFoxLegL)" /></g>
          <g id="legR"><image href="fox-legR.png" x="0" y="0" width="635" height="618" clip-path="url(#clipFoxLegR)" /></g>
          <g id="pawR"><image href="fox-arm.png" x="0" y="0" width="635" height="618" clip-path="url(#clipFoxArm)" /></g>
          <!-- 原圖本體（去背＋去花，部件已拆出） -->
          <image href="fox-body.png" x="0" y="0" width="635" height="618" />
          <!-- 蓋住原圖畫死的眼睛（毛色純白；不隨視線移動的底） -->
          <ellipse cx="295" cy="290" rx="14" ry="18" fill="#FFFFFF" />
          <ellipse cx="337" cy="294" rx="14" ry="18" fill="#FFFFFF" />
          <!-- 臉（可動圖層） -->
          <g id="face">
            <g id="eyes-open">
              <g class="eye"><ellipse cx="295" cy="290" rx="9" ry="13.5" fill="#000" /></g>
              <g class="eye"><ellipse cx="337" cy="294" rx="9" ry="13.5" fill="#000" /></g>
            </g>
            <g id="eyes-happy">
              <path style="stroke-width:15" d="M276 296 Q291 280 306 296" />
              <path style="stroke-width:15" d="M326 300 Q341 284 356 300" />
            </g>
            <g id="eyes-closed">
              <path style="stroke-width:15" d="M277 289 Q291 301 305 289" />
              <path style="stroke-width:15" d="M327 293 Q341 305 355 293" />
            </g>
          </g>
        </g>
      </g>
    </svg>
  </template>

  <!-- ================= 角色：膠布（拿小刀的鹿角狗，同工法拆件） ================= -->
  <template id="char-jiaobu">
    <svg id="pet" viewBox="121 63 553 635" xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         stroke-linejoin="round" stroke-linecap="round">
      <defs>
        <!-- 裁切矩形比挖除區外擴 8px：圓角只咬空白邊，不吃存根覆蓋區 -->
        <clipPath id="clipJbLegL"><rect x="160" y="621" width="148" height="97" rx="14" /></clipPath>
        <clipPath id="clipJbLegR"><rect x="470" y="621" width="148" height="97" rx="14" /></clipPath>
        <clipPath id="clipJbPaw"><rect x="368" y="408" width="196" height="136" rx="10" /></clipPath>
      </defs>
      <ellipse id="shadow" cx="397" cy="688" rx="175" ry="12" />
      <g id="root">
        <g id="body">
          <!-- 部件（腿與尾巴畫在身體後面；尾巴存根全程被 body 蓋住，不需裁切） -->
          <g id="tail"><image href="jiaobu-tail.png" x="0" y="0" width="768" height="768" /></g>
          <g id="legL"><image href="jiaobu-legL.png" x="0" y="0" width="768" height="768" clip-path="url(#clipJbLegL)" /></g>
          <g id="legR"><image href="jiaobu-legR.png" x="0" y="0" width="768" height="768" clip-path="url(#clipJbLegR)" /></g>
          <!-- 原圖本體（刀與手掌處已補毛色） -->
          <image href="jiaobu-body.png" x="0" y="0" width="768" height="768" />
          <!-- 刀臂在本體前面：舉刀時露出的底下是補好的毛色，不會破洞 -->
          <g id="pawR"><image href="jiaobu-pawR.png" x="0" y="0" width="768" height="768" clip-path="url(#clipJbPaw)" /></g>
          <!-- 蓋住原圖畫死的眼睛 -->
          <ellipse cx="308" cy="323" rx="17" ry="25" fill="#CEB278" />
          <ellipse cx="404" cy="320" rx="17" ry="25" fill="#CEB278" />
          <g id="face">
            <g id="eyes-open">
              <g class="eye"><ellipse cx="308" cy="323" rx="12" ry="20" fill="#000" /></g>
              <g class="eye"><ellipse cx="404" cy="320" rx="12" ry="20" fill="#000" /></g>
            </g>
            <g id="eyes-happy">
              <path style="stroke-width:15" d="M293 327 Q308 309 323 327" />
              <path style="stroke-width:15" d="M389 324 Q404 306 419 324" />
            </g>
            <g id="eyes-closed">
              <path style="stroke-width:15" d="M294 317 Q308 329 322 317" />
              <path style="stroke-width:15" d="M390 314 Q404 326 418 314" />
            </g>
          </g>
        </g>
      </g>
    </svg>
  </template>

  <!-- ================= 角色：玥玥（灰色長吻小獸，同工法拆件） ================= -->
  <template id="char-yueyue">
    <svg id="pet" viewBox="40 21 688 726" xmlns="http://www.w3.org/2000/svg"
         xmlns:xlink="http://www.w3.org/1999/xlink"
         stroke-linejoin="round" stroke-linecap="round">
      <defs>
        <clipPath id="clipYyLegL"><rect x="42" y="658" width="221" height="108" rx="14" /></clipPath>
        <clipPath id="clipYyLegR"><rect x="447" y="658" width="176" height="108" rx="14" /></clipPath>
        <clipPath id="clipYyArm"><rect x="30" y="392" width="130" height="162" rx="12" /></clipPath>
      </defs>
      <ellipse id="shadow" cx="380" cy="738" rx="210" ry="12" />
      <g id="root">
        <g id="body">
          <!-- 手臂根部與身體是灰對灰平色交界，切邊移動時隱形 -->
          <g id="tail"><image href="yueyue-tail.png" x="0" y="0" width="768" height="768" /></g>
          <g id="legL"><image href="yueyue-legL.png" x="0" y="0" width="768" height="768" clip-path="url(#clipYyLegL)" /></g>
          <g id="legR"><image href="yueyue-legR.png" x="0" y="0" width="768" height="768" clip-path="url(#clipYyLegR)" /></g>
          <g id="pawR"><image href="yueyue-pawR.png" x="0" y="0" width="768" height="768" clip-path="url(#clipYyArm)" /></g>
          <image href="yueyue-body.png" x="0" y="0" width="768" height="768" />
          <ellipse cx="347" cy="226" rx="16" ry="24" fill="#A29F97" />
          <ellipse cx="404" cy="234" rx="16" ry="24" fill="#A29F97" />
          <g id="face">
            <g id="eyes-open">
              <g class="eye"><ellipse cx="347" cy="226" rx="9" ry="15" fill="#000" /></g>
              <g class="eye"><ellipse cx="404" cy="234" rx="9" ry="15" fill="#000" /></g>
            </g>
            <g id="eyes-happy">
              <path style="stroke-width:16" d="M333 231 Q347 215 361 231" />
              <path style="stroke-width:16" d="M390 239 Q404 223 418 239" />
            </g>
            <g id="eyes-closed">
              <path style="stroke-width:16" d="M334 221 Q347 233 360 221" />
              <path style="stroke-width:16" d="M391 229 Q404 241 417 229" />
            </g>
          </g>
        </g>
      </g>
    </svg>
  </template>

  <script src="pet.js"></script>
</body>
</html>
