<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const abs=n=>new URL(n,location.href).href;
const masks = Object.fromEntries(Object.entries(window.ApocMasks||{}).map(([k,v])=>[k,abs(v)]));
const POOL  = window.ApocPool||[];
document.documentElement.style.setProperty('--frame-mask',`url("${masks.frame}")`);
document.documentElement.style.setProperty('--glitter-mask',`url("${masks.glitter}")`);
document.body.classList.add('font-system','gem-faceted','ink-chroma');

const LABEL={common:'普通',rare:'精良',epic:'史詩',legendary:'傳說',mythic:'神話'};
const TILT ={common:6,rare:8,epic:10,legendary:12,mythic:14};
const ZLIFT={common:24,rare:32,epic:40,legendary:48,mythic:56};
const SURGE={common:'#9fb0c8',rare:'#6fd8ff',epic:'#c39dff',legendary:'#ffd45c',mythic:'#ff7ad0'};
// 2026-09-12 使用者定案（DESIGN-2026-09-12-content-architecture.md §3.2）：神話 0.25%／傳說 4%／史詩 20%／精良 75.75%，沒有普通、沒有保底
const RATE=[['mythic',.0025],['legendary',.04],['epic',.20],['rare',.7575]];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');

const byRarity={};
for(const c of POOL)(byRarity[c.rarity] ||= []).push(c);

function rollRarity(){let r=Math.random(),acc=0;for(const [k,p] of RATE){acc+=p;if(r<acc&&byRarity[k])return k;}return 'rare';}
function pick(rarity){const a=byRarity[rarity]||byRarity.rare;return a[Math.floor(Math.random()*a.length)];}
function draw(n){
  if(window.__apocIds){const m=Object.fromEntries(POOL.map(c=>[c.id,c]));return window.__apocIds.slice(0,n).map(id=>m[id]).filter(Boolean);}
  const out=[];
  for(let i=0;i<n;i++) out.push(pick(rollRarity()));
  // 精裝池沒有保底（使用者定案，HANDOFF 六節也是這樣寫）——不要偷塞傳說
  return out;
}

/* ── 卡面：跟展示頁同一套 DOM 與 CSS ─────────────────────── */
function node(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n;}
function material(p){const s=node('div','foil-stack');['spectrum','relief','etch'].forEach(x=>s.append(node('div','foil-'+x)));
  p.append(s,node('div','foil-fiber'),node('div','foil-grain'),node('div','foil-glare'));}
function path(n){
  if(window.ApocAssets&&window.ApocAssets[n]) return abs(window.ApocAssets[n]);
  return (typeof asset==='function') ? asset(n) : ((n.startsWith('layer-') || n.startsWith('fx/')) ? n : 'art/'+n);
}
function makeFace(d){
  // 卡面完全交給共用建立器，抽卡頁不再自己拼一套 DOM
  const card=HoloCardFace.create(d,{masks,resolve:path});
  HoloCardFace.observe(card);
  return card;
}
// 名字與稀有度是卡片寬度的固定比例（跟展示頁同一個基準：24px / 290px 卡寬）。
// 少了這一段，--name-fs 會退回 20px，小卡上的字就會撐爆文字框。


// 揭曉後的卡：卡片本身固定不動（不轉角度、不做圖層位移），
// 但箔面、鍍膜、反光與彩虹相位跟著游標跑，指上去才看得到材質。
// 抽卡揭曉後：卡片不轉，只有材質光影跟著游標（HANDOFF 六之五）
function paintFoil(card,rarity,x,y){HoloCardFace.paint(card,rarity,x,y,{tilt:false});}

/* ── 演出 ─────────────────────────────────────────── */
/* Tabletop port: src/clicker-gacha.js layout and src/gacha.js ten-card rows.
 * Original 620ms deal and 95/50ms stagger from gacha-mode-hearthstone.js.
 * Flat rotations and measured clearance replace the overlapping round-29 fan.
 */
window.CeremonyTable = Object.freeze({
  dealDuration:620,
  stagger:count=>count===10?50:95,
  layout(n,{width=innerWidth,height=innerHeight,index=0}={}){
    const phone=width<=600;
    const smallDesktop=!phone&&width<=1024;
    const cw=phone?Math.min(n===1?304:288,width-64):n===1?Math.max(190,375*Math.min(width/1440,height/900)):smallDesktop?Math.max(n>5?140:170,Math.min(n>5?198:208,(width*.88-32)/5,(height-(n>5?210:148))/(n>5?2.9:1.4))):Math.max(n>5?150:190,Math.min(n>5?198:208,(width*.88-32)/5,(height-(n>5?210:140))/(n>5?3.0:1.7)));
    // 2026-09-13：十連的下限從 190 放到 150、扣掉的邊界從 140 加到 210——960×640（縮 0.75 後 741 高）的殼裡兩排卡會壓到「收下」與提示字
    return Array.from({length:n},(_,i)=>({cw,
      x:phone?(i-index)*(cw+64):n===1?0:((i%5)-(Math.min(n,5)-1)/2)*(cw+Math.max(8,Math.min(cw*.14,(width*.88-5*cw)/4))),
      y:phone?-24:n>5?(Math.floor(i/5)-.5)*(cw*1.4+Math.max(8,Math.min(cw*.18,height-140-cw*2.8))):-24,rz:0,page:0}));
  }
});

// Ported from src/gacha-fx.js: original numeric floors retained. Caller advances seconds.
// ClawdPet 抽卡 ─ Canvas 特效層（粒子／射線／塵）
// 只有在有活動特效時才跑 rAF；桌上沒事的時候這層完全靜止，不吃 CPU。
window.CeremonyFx = ({ rng = Math.random } = {}) => {
  let canvas, ctx, over, W, H;
  let under = null;      // 卡底下那層（射線用）
  const parts = [];      // 粒子
  const layers = [];     // 長效層（射線等），每個有 update(dt)/draw() 與 dead
  let running = false;
  let last = 0;
  let offsetX=0,offsetY=0,ringOpacity=.9;

  const RC = {
    common: '#9d9d9d', rare: '#0070dd', epic: '#a335ee', legendary: '#ff8000', mythic: '#FF4FD8',
  };
  const rainbow = ['#ff4fd8','#ffb347','#fff275','#7dff9c','#5ad7ff','#b48bff','#ff7ab8'];
  const rand = (a, b) => a + rng() * (b - a);
  const TAU = Math.PI * 2;

  function init(el, underEl, overEl) {
    canvas = el; ctx = el.getContext('2d');over=overEl?overEl.getContext('2d'):ctx;
    W = el.width; H = el.height;
    under = underEl ? underEl.getContext('2d') : ctx;
  }

  function kick() {}
  function step(dt,paint=true) {
    if(paint){if(over!==ctx){over.resetTransform();over.clearRect(0,0,W,H);over.save();over.translate(offsetX,offsetY);}ctx.resetTransform();under.resetTransform();
    ctx.clearRect(0, 0, W, H);
    if (under !== ctx) under.clearRect(0, 0, W, H);
    ctx.save();ctx.translate(offsetX,offsetY);
    if(under!==ctx){under.save();under.translate(offsetX,offsetY);}}
    for (let i = layers.length - 1; i >= 0; i--) {
      const l = layers[i];
      if(dt>0)l.update(dt);
      if (l.dead) { layers.splice(i, 1); continue; }
      if(paint)l.draw(l.over ? over : l.under ? under : ctx);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      if (dt>0 && p.update) p.update(p, dt);
      else if(dt>0) {
        p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
      if(paint)drawPart(p);
    }
    if(paint){if(over!==ctx)over.restore();ctx.restore();if(under!==ctx)under.restore();}
    if (!parts.length && !layers.length) { running = false; ctx.clearRect(0, 0, W, H); if (under !== ctx) under.clearRect(0, 0, W, H); }
  }

  function drawPart(p) {
    const k = p.life / p.max;
    ctx.save();
    ctx.globalCompositeOperation = p.blend || 'lighter';
    ctx.globalAlpha = Math.min(1, k * (p.fadeK || 1.6));
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.img) {
      // 自訂貼圖粒子（更衣室的櫻花／雪花等）：r 是半寬
      const s = p.r * 2 * (p.shrink ? (0.3 + 0.7 * k) : 1);
      if (p.img.complete && p.img.naturalWidth) ctx.drawImage(p.img, -s / 2, -s / 2, s, s);
    } else if (p.shape === 'shard') {
      // 鋁箔碎片：長方形，正反面用亮暗兩色模擬翻面
      const face = Math.cos(p.rot * 2) > 0 ? p.color : p.color2;
      ctx.fillStyle = face;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else if (p.shape === 'star') {
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        ctx.lineTo(Math.cos(a) * p.r, Math.sin(a) * p.r);
        ctx.lineTo(Math.cos(a + Math.PI / 4) * p.r * 0.32, Math.sin(a + Math.PI / 4) * p.r * 0.32);
      }
      ctx.closePath(); ctx.fill();
    } else if (p.shape === 'streak') {
      ctx.strokeStyle = p.color; ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-p.vx * 0.04, -p.vy * 0.04); ctx.stroke();
    } else {
      const r = p.r * (p.shrink ? k : 1);
      if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = p.glow; }
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.2, r), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function spawn(p) {
    parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0.985, rot: 0, vr: 0, r: 2, life: 1, color: '#fff' }, p, { max: p.life }));
  }

  // ---------- 撕包爆光：火花 + 鋁箔碎片 ----------
  function packBurst(x, y) {
    for (let i = 0; i < 70; i++) {
      const a = rand(0, TAU), sp = rand(120, 620);
      spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, g: 420, drag: 0.975,
        r: rand(1.2, 3.2), life: rand(0.5, 1.1), color: rng() < 0.5 ? '#ffe7a6' : '#ffb866', glow: 6, shrink: true, shape: 'streak' });
    }
    const foil = ['#1f8a99', '#12475a', '#d08a4a', '#f0b26a', '#2b3f7a'];
    const foilDark = ['#0d3f48', '#082530', '#7a4a20', '#8a5a2a', '#141f40'];
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), sp = rand(80, 380);
      const ci = Math.floor(rand(0, foil.length));
      spawn({ x: x + rand(-30, 30), y: y + rand(-60, 60), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, g: 900, drag: 0.985,
        rot: rand(0, TAU), vr: rand(-12, 12), w: rand(6, 16), h: rand(4, 10), life: rand(0.9, 1.6), color: foil[ci], color2: foilDark[ci], shape: 'shard', fadeK: 3 });
    }
    // 光暈環
    layers.push(ring(x, y, '#ffe7a6', 0.55, 380, 10));
    kick();
  }

  // ---------- 環形衝擊波 ----------
  function ring(x, y, color, dur, maxR, width) {
    let t = 0;
    return {
      dead: false, over:true,
      update(dt) { t += dt; if (t >= dur) this.dead = true; },
      draw(ctx) {
        const k = t / dur, e = 1 - Math.pow(1 - k, 3);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (1 - k) * ringOpacity;
        ctx.strokeStyle = color; ctx.lineWidth = width * (1 - k * 0.6);
        ctx.shadowColor = color; ctx.shadowBlur = 20;
        // 第一幀的 t 有機會是很小的負數（dt 從還沒校正的 last 算出來），k<0 會讓 e<0、半徑變負，
        // arc() 收到負半徑會直接丟例外把整條演出打斷。照第 115 行既有的做法夾住。
        ctx.beginPath(); ctx.arc(x, y, Math.max(0.2, 10 + e * maxR), 0, TAU); ctx.stroke();
        ctx.restore();
      },
    };
  }

  // ---------- 揭曉：依稀有度 ----------
  function reveal(x, y, rarity) {
    const c = RC[rarity] || RC.common;
    if (rarity === 'mythic') { const scope = createScope(); scope.reveal(x,y,rarity); scope.rainbowRing(x,y); }
    if (rarity === 'common') {
      // 幾顆灰塵掉下來就好
      for (let i = 0; i < 8; i++) {
        spawn({ x: x + rand(-40, 40), y: y + rand(-60, 20), vx: rand(-30, 30), vy: rand(-40, 10), g: 200, r: rand(1, 2), life: rand(0.4, 0.8), color: '#cfcfcf', blend: 'source-over', fadeK: 1 });
      }
      kick(); return;
    }
    if (rarity === 'rare') {
      layers.push(ring(x, y, c, 0.5, 160, 6));
      for (let i = 0; i < 26; i++) {
        const a = rand(0, TAU), sp = rand(60, 260);
        spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, g: 260, r: rand(1.5, 3.5), life: rand(0.5, 1), color: rng() < 0.6 ? '#7fc0ff' : '#ffffff', glow: 8, shrink: true, shape: 'star', rot: rand(0, TAU), vr: rand(-4, 4) });
      }
      kick(); return;
    }
    if (rarity === 'epic') {
      layers.push(ring(x, y, c, 0.6, 260, 8));
      layers.push(ring(x, y, '#e2b6ff', 0.45, 160, 4));
      // 一圈旋著往外散的紫光，像被吸出去再甩開
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * TAU, sp = rand(140, 330);
        spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0, drag: 0.94, r: rand(2, 4), life: rand(0.7, 1.2), color: rng() < 0.5 ? c : '#e2b6ff', glow: 12, shrink: true,
          update(p, dt) { const ang = Math.atan2(p.vy, p.vx) + dt * 2.2; const s = Math.hypot(p.vx, p.vy) * p.drag; p.vx = Math.cos(ang) * s; p.vy = Math.sin(ang) * s; p.x += p.vx * dt; p.y += p.vy * dt; } });
      }
      for (let i = 0; i < 14; i++) {
        spawn({ x: x + rand(-50, 50), y: y + rand(-70, 70), vx: rand(-20, 20), vy: rand(-90, -40), g: -30, r: rand(2, 4), life: rand(0.9, 1.6), color: '#ffffff', glow: 10, shape: 'star', rot: rand(0, TAU), vr: rand(-3, 3) });
      }
      kick(); return;
    }
    // 傳說：一圈貼卡的衝擊波、外緣火星、少量餘燼與星芒——中央留給立繪，不用大環蓋全桌
    layers.push(ring(x, y, '#ffd27a', 0.55, 220, 8));
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU), sp = rand(150, 600);
      spawn({ x: x + Math.cos(a) * 70, y: y + Math.sin(a) * 100, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, g: 500, drag: 0.972, r: rand(1.5, 3.5), life: rand(0.7, 1.5), color: rng() < 0.5 ? '#ffd27a' : c, glow: 8, shrink: true, shape: 'streak' });
    }
    for (let i = 0; i < 20; i++) {
      spawn({ x: x + rand(-90, 90), y: y + rand(-40, 110), vx: rand(-15, 15), vy: rand(-70, -25), g: -25, r: rand(1.5, 3), life: rand(1.6, 3), color: rng() < 0.7 ? '#ff9a3c' : '#ffe7a6', glow: 10, shrink: true, fadeK: 1.2,
        update(p, dt) { p.vx += Math.sin(p.life * 7 + p.x) * 30 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } });
    }
    for (let i = 0; i < 8; i++) {
      const a = rand(0, TAU), sp = rand(120, 220);
      spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 80, drag: 0.97, r: rand(4, 8), life: rand(1, 1.8), color: '#fff3d0', glow: 16, shape: 'star', rot: rand(0, TAU), vr: rand(-2, 2), shrink: true });
    }
    kick();
  }

  // ---------- 傳說射線：從卡後方放射、緩慢旋轉的橘光，fadeIn → 停留 → fadeOut ----------
  // 回傳的物件有 stop()，讓流程在揭曉後把它慢慢收掉
  function rays(x, y, { color = '#ff8000', n = 14, len = 900, fadeIn = 0.5, hold = 0.6, tail = 0.8, mythic = false } = {}) {
    hold = Number.isFinite(hold) ? Math.min(hold, 4) : 0.6;
    let t = 0, rot = rand(0, TAU), alpha = 0, stopping = false, fadeOut = 0;
    const layer = {
      dead: false,
      under: true,
      stop(dur = tail) { stopping = true; fadeOut = dur; },
      update(dt) {
        t += dt; rot += dt * 0.35;
        if (stopping) { alpha -= dt / fadeOut; if (alpha <= 0) this.dead = true; }
        else alpha = Math.min(1, t / fadeIn);
        if (t > hold && !stopping) this.stop();
      },
      draw(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.translate(x, y);
        // 底光
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 260);
        g.addColorStop(0, `rgba(255,190,90,${0.55 * alpha})`);
        g.addColorStop(1, 'rgba(255,128,0,0)');
        ctx.fillStyle = g; ctx.fillRect(-300, -300, 600, 600);
        // 射線：兩組不同轉速、不同寬度疊在一起，才不會像轉盤
        for (let set = 0; set < 2; set++) {
          const r = rot * (set ? -0.6 : 1) + set * 0.3;
          const count = set ? n - 3 : n;
          for (let i = 0; i < count; i++) {
            const a = r + (i / count) * TAU;
            const w = (set ? 0.05 : 0.09) * (0.7 + 0.3 * Math.sin(t * 2.3 + i * 1.7));
            const grad = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
            grad.addColorStop(0, mythic ? rainbow[i % 7] + '99' : `rgba(255,210,120,${(set ? 0.28 : 0.42) * alpha})`);
            grad.addColorStop(0.5, mythic ? rainbow[i % 7] + '44' : `rgba(255,128,0,${0.14 * alpha})`);
            if (mythic) ctx.globalAlpha = alpha;
            grad.addColorStop(1, 'rgba(255,128,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a - w) * len, Math.sin(a - w) * len);
            ctx.lineTo(Math.cos(a + w) * len, Math.sin(a + w) * len);
            ctx.closePath(); ctx.fill();
          }
        }
        ctx.restore();
      },
    };
    layers.push(layer);
    kick();
    return layer;
  }

  // ---------- 化塵：卡碎成金粉，沿弧線飛向塵計數器 ----------
  function dustStream(x, y, tx, ty, { n = 46, onArrive } = {}) {
    let arrived = 0;
    for (let i = 0; i < n; i++) {
      const delay = rand(0, 0.35);
      const sx = x + rand(-60, 60), sy = y + rand(-90, 90);
      const cx = (sx + tx) / 2 + rand(-160, 160), cy = Math.min(sy, ty) - rand(60, 220);
      const dur = rand(0.75, 1.2);
      spawn({ x: sx, y: sy, r: rand(1.5, 3.2), life: delay + dur + 0.05, color: rng() < 0.7 ? '#ffd24a' : '#fff6c8', glow: 8, fadeK: 8,
        t0: delay, dur, sx, sy, cx, cy,
        update(p, dt) {
          const el = p.max - p.life;
          if (el < p.t0) { p.x = p.sx + rand(-1, 1); p.y = p.sy - (el / p.t0) * 8; return; }
          const k = Math.min(1, (el - p.t0) / p.dur);
          const e = k * k * (3 - 2 * k);
          // 二次貝茲：出發 → 控制點（上方）→ 塵計數器
          p.x = (1 - e) * (1 - e) * p.sx + 2 * (1 - e) * e * p.cx + e * e * tx;
          p.y = (1 - e) * (1 - e) * p.sy + 2 * (1 - e) * e * p.cy + e * e * ty;
          if (k >= 1 && !p.done) { p.done = true; p.life = 0.01; arrived++; if (onArrive) onArrive(arrived, n); }
        } });
    }
    kick();
  }

  // ---------- 卡飛進圖鑑時，終點噴一小撮亮片 ----------
  function puff(x, y, color = '#ffd24a') {
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), sp = rand(40, 140);
      spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 120, r: rand(1, 2.5), life: rand(0.3, 0.6), color, glow: 6, shrink: true });
    }
    kick();
  }

  // scope 只移除自己建立的物件，收集動畫不會被上一場的取消波及。
  function createScope({ rng = Math.random } = {}) {
    const ownedParts = new Set(), ownedLayers = new Set();
    let stopped = false;
    return {
      spawn(p) {
        if (stopped) return;
        spawn(p); ownedParts.add(parts[parts.length - 1]); kick();
      },
      layer(l) {
        if (stopped) return;
        layers.push(l); ownedLayers.add(l); kick(); return l;
      },
      ring,
      unveil(x, y) {
        for (let i = 0; i < 8; i++) {
          const a = -Math.PI / 2 + (rng() - .5) * Math.PI, speed = 70 + rng() * 100;
          this.spawn({ sprite: 6, x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
            g: 180, r: 3 + rng() * 3, life: .45, color: '#ff8000', shrink: true });
        }
      },
      rainbowRing(x, y, dur = .8, maxR = 220) {
        let age = 0;
        return this.layer({dead:false, over:true, update(dt) { age += dt; this.dead = age >= dur; }, draw(c) {
          c.save(); c.globalAlpha = Math.max(0,1-age/dur)*ringOpacity; c.lineWidth = 7;
          for (let i=0;i<7;i++) { c.strokeStyle=rainbow[i]; c.beginPath(); c.arc(x,y,20+maxR*Math.min(1,age/dur),i*TAU/7,(i+1)*TAU/7); c.stroke(); }
          c.restore();
        }});
      },
      packBurst(x, y) { if (!stopped) packBurst(x, y); },
      reveal(x, y, rarity) {
        const count = { common: 0, rare: 8, epic: 12, legendary: 20, mythic: 32 }[rarity];
        const life = { common: 0, rare: .24, epic: .42, legendary: .6, mythic: .8 }[rarity];
        for (let i = 0; i < count; i++) {
          const a = i / count * TAU + (rng() - .5) * .2;
          this.spawn({ x: x + Math.cos(a) * 78, y: y + Math.sin(a) * 108,
            vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, r: 1.5, life,
            color: rarity === 'mythic' ? rainbow[i % 7] : RC[rarity], shape: rarity === 'epic' ? 'star' : 'streak', shrink: true });
        }
        if (rarity === 'legendary' || rarity === 'mythic') {
          let age = 0;
          this.layer({ dead: false, under: true,
            update(dt) { age += dt; this.dead = age >= .6; },
            draw(c) {
              c.save(); c.translate(x, y); c.strokeStyle = '#ffba63';
              c.globalAlpha = Math.sin(Math.PI * age / .6) * .5; c.lineWidth = 7;
              for (let i = 0; i < 6; i++) {
                const a = i * TAU / 6;
                c.beginPath(); c.moveTo(Math.cos(a) * 80, Math.sin(a) * 110);
                c.lineTo(Math.cos(a) * 185, Math.sin(a) * 190); c.stroke();
              }
              c.restore();
            },
          });
        }
      },
      stop() {
        if (stopped) return;
        stopped = true;
        for (let i = parts.length - 1; i >= 0; i--) if (ownedParts.has(parts[i])) parts.splice(i, 1);
        for (let i = layers.length - 1; i >= 0; i--) if (ownedLayers.has(layers[i])) layers.splice(i, 1);
        ownedParts.clear(); ownedLayers.clear();
        // 下一幀自然停止；先清畫布，避免背景分頁的 rAF 延後留下殘影。
        ctx?.clearRect(0, 0, W, H); under?.clearRect(0, 0, W, H);
      },
    };
  }
  function stop() { parts.length=layers.length=0; ctx?.clearRect(0,0,W,H); under?.clearRect(0,0,W,H); }
  function flash(x,y,{duration=.16,radius=650,strength=.65,color='255,240,215'}={}) {
    let age=0;
    layers.push({dead:false,under:true,update(dt){age+=dt;this.dead=age>=duration},draw(c){
      const alpha=strength*Math.min(1,age/.035)*Math.min(1,(duration-age)/.35);
      c.save();c.globalCompositeOperation='lighter';
      const g=c.createRadialGradient(x,y,30,x,y,radius);
      g.addColorStop(0,`rgba(${color},${alpha})`);g.addColorStop(.6,`rgba(${color},${alpha*.7})`);g.addColorStop(1,`rgba(${color},0)`);
      c.fillStyle=g;c.fillRect(x-radius,y-radius,radius*2,radius*2);c.restore();
    }});
  }
  function strengthen(x,y,rarity) {
    ringOpacity=["legendary","mythic"].includes(rarity)?.38:.9;
    const high=['legendary','mythic'].includes(rarity),mythic=rarity==='mythic';
    // Original particles and rings remain intact; add exposure and extend the impact.
    reveal(x,y,rarity);
    // Equal alpha made violet darker than neutral (42 vs 49). Normalize the
    // flash's luminance first, then give epic a 20% exposure step after F.
    const epicStrength=.25*(255*.299+238*.587+208*.114)/(225*.299+185*.587+255*.114)*1.2;
    flash(x,y,{duration:high?(mythic?2.85:2.25):.7,radius:high?760:620,strength:high?1.02:rarity==='epic'?epicStrength:.25,color:mythic?'218,241,255':rarity==='epic'?'225,185,255':'255,238,208'});
    if(high){
      rays(x,y,{fadeIn:.08,hold:mythic?2.8:2.2,tail:mythic?1.2:1,mythic});
      layers.push(ring(x,y,mythic?'#e7faff':'#fff0b8',1.04,410,28));
      if(mythic)createScope({rng}).rainbowRing(x,y,1.2,420);
    }
  }
  return {init,step,stop,ring,spawn,reveal,rays,flash,strengthen,createScope,move(x,y){offsetX=x;offsetY=y},
    get active(){return parts.length+layers.length},get particles(){return parts.length}};
};

// Ported from src/gacha-audio.js. Synthesis parameters unchanged; observation hooks only.
// ClawdPet 抽卡 ─ 音效（全部 WebAudio 現場合成，沒有任何音檔）
// 設計原則：每個音都是「一個動作的回饋」，短、乾、有重量；只有傳說允許拖長尾巴。
// AudioContext 要在使用者手勢後才能建，所以 ensure() 由第一次 pointerdown 呼叫。
window.CeremonyAudio = (() => {
  let activeScope = null;
  let ctx = null;
  let master = null;
  let verb = null;      // 簡易迴響（feedback delay），只給揭曉音用

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume().catch(() => {}); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.7;
    master.connect(ctx.destination);
    // 迴響：兩條 delay 交叉回授 + 低通，便宜但夠有空間感
    verb = ctx.createGain();
    verb.gain.value = 0.35;
    const d1 = ctx.createDelay(1); d1.delayTime.value = 0.173;
    const d2 = ctx.createDelay(1); d2.delayTime.value = 0.251;
    const fb1 = ctx.createGain(); fb1.gain.value = 0.42;
    const fb2 = ctx.createGain(); fb2.gain.value = 0.38;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    verb.connect(d1); verb.connect(d2);
    d1.connect(fb1).connect(d2); d2.connect(fb2).connect(d1);
    d1.connect(lp); d2.connect(lp); lp.connect(master);
    return ctx;
  }

  // ---------- 基本積木 ----------
  const now = () => ctx.currentTime;
  function env(node, t, a, d, peak = 1, s = 0, r = 0.05) {
    const g = node.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(0.0001, t);
    g.linearRampToValueAtTime(peak, t + a);
    g.exponentialRampToValueAtTime(Math.max(s * peak, 0.0001), t + a + d);
    if (s > 0) g.setValueAtTime(s * peak, t + a + d);
    g.exponentialRampToValueAtTime(0.0001, t + a + d + r);
  }
  function tone(freq, { type = 'sine', t = now(), a = 0.005, d = 0.2, r = 0.05, s = 0, gain = 0.3, detune = 0, to = master, slide = null, slideT = 0 } = {}) {
    to = activeScope ? activeScope.route(to) : to;
    const o = ctx.createOscillator();
    activeScope?.track(o);
    o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + (slideT || d));
    const g = ctx.createGain();
    env(g, t, a, d, gain, s, r);
    o.connect(g).connect(to);
    api.onSchedule?.({type:'tone',freq,t,a,d,r,gain,detune,slide});
    o.start(t); o.stop(t + a + d + r + 0.05);
    return o;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    return src;
  }
  function noiseHit({ t = now(), a = 0.002, d = 0.12, r = 0.05, gain = 0.4, type = 'bandpass', f0 = 1500, f1 = null, q = 0.8, to = master } = {}) {
    to = activeScope ? activeScope.route(to) : to;
    const src = noise();
    activeScope?.track(src);
    const flt = ctx.createBiquadFilter();
    flt.type = type; flt.Q.value = q; flt.frequency.setValueAtTime(f0, t);
    if (f1) flt.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    const g = ctx.createGain();
    env(g, t, a, d, gain, 0, r);
    src.connect(flt).connect(g).connect(to);
    api.onSchedule?.({type:'noiseHit',t,a,d,r,gain,typeFilter:type,f0,f1,q});
    src.start(t); src.stop(t + a + d + r + 0.05);
    return src;
  }
  // 鐘：一個基頻 + 非諧泛音（真實鐘的泛音比不是整數倍），各自不同衰減
  function bell(freq, t, { gain = 0.5, decay = 2.6, to = master } = {}) {
    const partials = [[1, 1, 1], [2.0, 0.55, 0.8], [2.76, 0.42, 0.7], [3.9, 0.25, 0.45], [5.4, 0.18, 0.35], [8.9, 0.08, 0.2]];
    for (const [ratio, amp, dscale] of partials) {
      tone(freq * ratio, { t, a: 0.003, d: decay * dscale, r: 0.3, gain: gain * amp, to });
      // 輕微失諧的第二層讓聲音「晃」——鐘的拍頻感
      tone(freq * ratio, { t, a: 0.003, d: decay * dscale * 0.9, r: 0.3, gain: gain * amp * 0.5, detune: 6, to });
    }
    // 敲擊瞬間的金屬「叮」
    noiseHit({ t, a: 0.001, d: 0.03, gain: gain * 0.5, f0: 5000, q: 2 });
  }

  // ---------- 對外：每個動作一個方法 ----------
  const api = { ensure, onSchedule: null, onSource: null };

  // 拿起卡包：很輕的紙質摩擦
  api.pick = () => { if (!ensure()) return; noiseHit({ d: 0.06, gain: 0.12, f0: 2500, f1: 1200, q: 1.5 }); };
  // 放到桌上／彈回托盤：悶悶的一下
  api.drop = (heavy = false) => {
    if (!ensure()) return;
    const t = now();
    tone(heavy ? 95 : 130, { type: 'sine', t, a: 0.003, d: 0.14, gain: heavy ? 0.5 : 0.28, slide: heavy ? 50 : 80, slideT: 0.12 });
    noiseHit({ t, d: 0.05, gain: heavy ? 0.25 : 0.14, type: 'lowpass', f0: 900, q: 0.5 });
  };
  // 就位：小小一聲確認（玻璃感）
  api.lock = () => {
    if (!ensure()) return;
    const t = now();
    tone(1320, { type: 'triangle', t, a: 0.003, d: 0.18, gain: 0.16, to: verb });
    tone(1980, { type: 'sine', t: t + 0.04, a: 0.003, d: 0.22, gain: 0.1, to: verb });
  };
  // 撕包：三段——鋸齒撕裂（顆粒噪音掃頻）→ 撕開後的氣流 → 爆光的低音衝擊
  api.tear = () => {
    if (!ensure()) return;
    const t = now();
    // 撕裂：一連串短促的顆粒，頻率往上爬
    for (let i = 0; i < 14; i++) {
      const tt = t + i * 0.028 + Math.random() * 0.006;
      noiseHit({ t: tt, a: 0.001, d: 0.02 + Math.random() * 0.015, r: 0.01, gain: 0.22 + i * 0.012, f0: 1800 + i * 220, q: 3 + Math.random() * 2 });
    }
    // 底下一層連續的紙撕聲
    noiseHit({ t, a: 0.02, d: 0.36, r: 0.06, gain: 0.2, f0: 700, f1: 3800, q: 0.7 });
  };
  api.burst = () => {
    if (!ensure()) return;
    const t = now();
    // 氣流：往上掃的噪音
    noiseHit({ t, a: 0.04, d: 0.45, r: 0.2, gain: 0.35, type: 'bandpass', f0: 400, f1: 6000, q: 0.6 });
    // 低音衝擊
    tone(70, { type: 'sine', t, a: 0.004, d: 0.5, gain: 0.7, slide: 32, slideT: 0.45 });
    // 光的「嗡」——高頻閃一下
    tone(2400, { type: 'sine', t: t + 0.02, a: 0.01, d: 0.5, gain: 0.12, slide: 4800, slideT: 0.3, to: verb });
  };
  // 發牌：每張一個乾脆的「啪」，音高微升
  api.deal = (i = 0) => {
    if (!ensure()) return;
    const t = now();
    noiseHit({ t, a: 0.001, d: 0.045, r: 0.02, gain: 0.3, f0: 2600 + i * 180, q: 1.2 });

addEventListener('keydown',e=>{if(e.key==='Escape'){if(screen==='ceremony')skipAll();else for(const s of slots)if(s.complete)s.resetPose?.();}
 if(screen==='results'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const d=e.key==='ArrowLeft'?-1:1;
 if(mobile())browse(d);else{selectedIndex=Math.max(0,Math.min(slots.length-1,selectedIndex+d));pageIndex=Math.floor(selectedIndex/5);relayout();slots.forEach((s,i)=>s.el.classList.toggle('selected',i===selectedIndex));}}
});
// Only the active draw owns cancellable work. Background CSS has an independent lifecycle.
const backgroundScope={hidden:false};
function backgroundVisibility(){const hidden=document.hidden;backgroundScope.hidden=hidden;win.classList.toggle('background-paused',hidden||reduced.matches);
 if(hidden){for(const a of anims)if(a.playState==='running'){a.pause();a.__visibilityPaused=true;}pauseTimers();pauseRafs();audio?.suspend();}
 else{for(const a of anims)if(a.__visibilityPaused){a.__visibilityPaused=false;a.play();}resumeTimers();resumeRafs();if(!muted&&(voices.size||collectionVoices.size))audio?.resume();}
}
document.addEventListener('visibilitychange',backgroundVisibility);reduced.addEventListener('change',backgroundVisibility);
win.style.setProperty('--pack',`url("${path('fx/foil-pack.webp')}")`);win.style.setProperty('--tear',`url("${path('fx/foil-tear.webp')}")`);
win.style.setProperty('--substrate', 'url(' + path('fx/summon-substrate.webp') + ')');
backgroundVisibility();
addEventListener('resize',()=>{if(slots.length)relayout();});
if(testing)window.__ceremony={events,pull,skipAll,openPack,syncFx:()=>fxPainters.forEach(paint=>paint(true)),reset:()=>{tickets=30;$('#ticket').textContent=ticketPolicy.unlimited?'∞':tickets;clearRun();},layout,ready:()=>ready,setScreen,state:()=>({screen,entryPhase,pageIndex,selectedIndex,generation,busy,cascading,skipped,anims:anims.size,timers:timers.size,rafs:rafs.size,voices:voices.size,complete:slots.filter(s=>s.complete).length,ids:slots.map(s=>s.data.id),collectable:!btn.fin.hidden}),pause:()=>win.getAnimations({subtree:true}).forEach(a=>a.pause())};

// ── 末世橋接（build_ceremony.py 加的，演出本體沒改）──────────────────────
// 主頁已經扣券並把結果寫進存檔；這裡只照清單演出，收下時回報。
btn.fin.addEventListener('click',()=>{if(parent!==window)parent.postMessage({apocCeremony:'collect'},'*');});
// 結果卡上的「新夥伴／★1→★2」徽章（使用者第四輪：直接標在抽卡結果，不另外跳視窗）。
// 主頁照抽到的順序算好傳進來；卡片定型（completeSlot）時掛上，清場（clearRun）時跟著卡一起消失。
let apocBadges=[];
const apocCompleteSlot=completeSlot;
completeSlot=function(s){apocCompleteSlot(s);const list=apocBadges[+s.el.dataset.i]||[];
  if(!list.length||s.el.querySelector('.apoc-badges'))return;const box=node('div','apoc-badges');
  for(const b of list){const tag=node('b','apoc-badge '+(b.kind||''));tag.textContent=b.text;box.append(tag);}s.el.append(box);};
window.ApocCeremony={
  play(ids,badges){apocBadges=Array.isArray(badges)?badges:[];if(busy||slots.length)clearRun();window.__apocIds=ids.slice();pull(ids.length);},
  // 重新整理時存檔裡還有沒收下的結果：直接跳到結果頁（原型的 skipAll 就是這條路）
  restore(ids,badges){this.play(ids,badges);const run=generation;const go=async()=>{
    if(run!==generation)return; if(!await ready)return;
    if(entryPhase!=='waiting'){requestAnimationFrame(go);return;} openPack(); skipAll();};go();},
  reset(){clearRun();hint.textContent='';},
  state:()=>({screen,entryPhase,busy,collectable:!btn.fin.hidden,ids:slots.map(s=>s.data.id)}),
};
parent!==window&&parent.postMessage({apocCeremony:'ready'},'*');
