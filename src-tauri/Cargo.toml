[package]
name = "clawd-pet"
version = "0.5.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
