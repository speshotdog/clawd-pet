<!-- v3 末世模式殼（2026-09-13）：在 map20 之上加頂欄（末世金幣）、底欄（地圖／編隊／招募／卡冊）、收藏卡、與 1.0 的 postMessage 橋。
     這個檔由 tools/apoc/build_apoc.py 注入 map20.template.html；map20／team20 本體不改。 -->
<!-- APOC_CSS -->
<style>
.apoc-top{position:fixed;left:0;right:0;top:0;height:56px;z-index:20;display:flex;align-items:center;gap:14px;padding:0 16px;background:#1b1e1a;border-bottom:2px solid var(--edge);color:var(--ink);font-family:inherit}
.apoc-top h1{margin:0;font-size:20px;letter-spacing:.06em}
.apoc-top .apoc-coins{margin-left:auto;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.apoc-top .apoc-coins i{font-style:normal;font-size:12px;color:var(--label)}
.apoc-top .apoc-coins b{font-size:22px}
.apoc-top .apoc-tickets{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--label)}.apoc-top .apoc-tickets b{font-size:16px;color:var(--ink)}
.apoc-top button,.apoc-nav button{background:#373d35;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
.apoc-nav{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:20;display:flex;gap:6px;padding:6px 10px;background:#1b1e1a;border-top:2px solid var(--edge)}
.apoc-nav button{flex:1}.apoc-nav button[aria-current=true]{background:var(--focus);color:#1b1e1a;font-weight:700}
body{padding-top:56px;padding-bottom:56px}
#open-team,#return-map{display:none}
/* 1280×853 畫布縮 0.75 進 960×640：隊伍網格 5 張一排要塞進主欄（原本 5×180 會左右溢出） */
@media (min-width:800px){.team-grid{grid-template-columns:repeat(5,148px)!important;grid-template-rows:repeat(2,225px)!important;gap:8px!important;padding:4px!important}}
#gacha-screen{position:fixed;left:0;right:0;top:56px;bottom:56px;z-index:10;background:#101115}#gacha-screen iframe{width:100%;height:100%;border:0}
.team-collect{margin-top:12px}.team-collect .collect-grid{display:flex;gap:12px;flex-wrap:wrap;padding:12px}
.team-collect .collect-card{width:120px;aspect-ratio:5/7;border:2px solid var(--edge);border-radius:8px;background:#101115 center/cover;cursor:pointer;position:relative;padding:0}
.team-collect .collect-card b{position:absolute;left:0;right:0;bottom:0;padding:4px;background:rgba(0,0,0,.55);color:#ffd6ea;font-size:12px}
.team-collect .collect-empty{padding:12px;color:var(--label);font-size:13px}
#advance,#fail,.footer-note{display:none!important}
.apoc-top .apoc-buy{padding:4px 10px;font-size:12px}
#apoc-battle{margin:10px 0 6px;display:grid;gap:8px}
#apoc-battle .hpbar{height:14px;border:1px solid var(--edge);background:#101115;border-radius:4px;overflow:hidden}#apoc-battle .hpbar i{display:block;height:100%;width:100%;background:#c9524a;transition:width .15s}
#apoc-battle .hptext{font:12px monospace;color:var(--label);display:flex;justify-content:space-between}
#apoc-battle button{padding:10px 14px;font-size:16px;font-weight:700;border-radius:8px;border:1px solid var(--edge);background:#373d35;color:var(--ink);cursor:pointer}
#apoc-battle #apoc-tap{background:var(--focus);color:#1b1e1a;font-size:20px;padding:16px;user-select:none;touch-action:manipulation}
#apoc-battle #apoc-tap:active{transform:scale(.97)}
#apoc-battle button:disabled{opacity:.45;cursor:not-allowed}
#apoc-battle .power{font-size:12px;color:var(--label)}
.proxy-star{position:absolute;top:3px;right:3px;background:#373d35;color:#ffd27a;font:12px/18px Consolas,monospace;padding:0 5px;border-left:0;min-width:0}
#apoc-battle .shieldbar{height:12px;border:1px solid var(--edge);background:#101115;border-radius:4px;overflow:hidden}
#apoc-battle .shieldbar i{display:block;height:100%;width:0;background:#6f8fd0;transition:width .12s}
#apoc-battle .shieldbar.broken i{background:#e0b33c;width:100%!important}
#apoc-battle .shieldtext{font:12px monospace;color:var(--label)}
#apoc-skills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#apoc-skills button{padding:6px 4px;font-size:12px;line-height:1.3;border-radius:6px;min-height:44px}
#apoc-skills button b{display:block;font-size:12px}
#apoc-skills button small{display:block;color:var(--label);font-size:11px}
#apoc-skills button[data-ready=true]{background:var(--focus);color:#1b1e1a;font-weight:700}
#apoc-skills button[data-ready=true] small{color:#1b1e1a}
#collect-view{position:fixed;inset:56px 0;z-index:15;background:#101115}#collect-view iframe{width:100%;height:100%;border:0}#collect-view button{position:absolute;right:12px;top:12px;z-index:2}
</style>
<!-- APOC_TOP -->
<div class="apoc-top"><h1>末世</h1><span class="apoc-tickets">末世券 <b id="apoc-tickets">0</b></span><span class="apoc-coins"><i>末世金幣</i><b id="apoc-coins">0</b></span><button id="apoc-buy" class="apoc-buy" title="用末世金幣換券">換券 1000</button><button id="apoc-back">返回 1.0</button></div>
<div class="apoc-nav" role="navigation" aria-label="末世分頁"><button data-go="map" aria-current="true">地圖</button><button data-go="team">編隊</button><button data-go="gacha">精裝招募</button><button data-go="collect">卡冊・收藏卡</button></div>
<section id="gacha-screen" hidden><iframe title="精裝招募" loading="lazy"></iframe></section>
<div id="collect-view" hidden><button id="collect-close">返回</button><iframe title="收藏卡" loading="lazy"></iframe></div>
<!-- APOC_COLLECT_RAIL -->
<section class="team-rail team-collect" data-team-ui data-team-rail aria-label="收藏卡"><i class="team-texture"></i><div class="team-skills-label"><span>收藏卡</span><small>末世限定 · 純收藏，不編隊</small></div><div id="collect-grid" class="collect-grid"></div></section>
<!-- APOC_JS -->
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const COLLECT={mohuashaonv:{name:'魔花少女',thumb:'../card-mohuashaonv.png',page:'mohuashaonv.html'}};
let state={coins:0,tickets:0,collectibles:[],progress:0,stage:null,power:0,canFight:false,need:0,ticketCost:1000,roster:null,skills:null,owned:null,cooldownUntil:0,collection:null,skillDefs:[null,null,null,null],skillCd:[0,0,0,0]};
let teamKey='';
function fmt(n){return n>=1e8?(n/1e8).toFixed(2)+'億':n>=1e4?(n/1e4).toFixed(n>=1e6?0:1)+'萬':Math.floor(n).toLocaleString('zh-TW')}
function renderTop(){$('#apoc-coins').textContent=fmt(state.coins||0);$('#apoc-tickets').textContent=state.tickets||0;$('#apoc-buy').disabled=(state.coins||0)<(state.ticketCost||1000);$('#apoc-buy').textContent=`換券 ${state.ticketCost||1000}`}
// ---- 戰鬥 HUD：掛在地圖右側面板（取代原型的「記錄通關／記錄失敗」）
function battleBox(){let b=$('#apoc-battle');if(b)return b;b=document.createElement('div');b.id='apoc-battle';b.innerHTML='<div class="hpbar"><i></i></div><div class="hptext"><span id="apoc-hp"></span><span id="apoc-timer"></span></div><div class="shieldbar" id="apoc-shield" hidden><i></i></div><small class="shieldtext" id="apoc-shieldtext" hidden></small><button id="apoc-fight">開戰</button><button id="apoc-tap" hidden>攻擊！</button><div id="apoc-skills"></div><small class="power"></small>';$('#next').after(b);
 $('#apoc-fight').onclick=()=>parent.postMessage({type:'apoc-fight'},'*');
 $('#apoc-tap').addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();parent.postMessage({type:'apoc-tap'},'*');const i=$('#apoc-tap');i.animate([{transform:'scale(.95)'},{transform:'scale(1)'}],{duration:120})});
 return b}
function renderBattle(){const b=battleBox(),st=state.stage,now=Date.now();const m=window.map20;
 if(m&&!m.busy&&m.progress!==state.progress)m.setProgress(state.progress);
 if(m){const bossIdx=Math.floor(state.progress/4)*4+3;if(bossIdx<20)m.setCooldown(bossIdx,state.cooldownUntil||0)}
 const onCurrent=!m||m.selected===state.progress;b.hidden=!onCurrent||state.progress>=20;
 $('#apoc-fight').hidden=!!st;$('#apoc-tap').hidden=!st;
 if(st){const pct=Math.max(0,st.hp/st.need*100);b.querySelector('.hpbar i').style.width=pct+'%';$('#apoc-hp').textContent=`血量 ${fmt(Math.max(0,st.hp))} / ${fmt(st.need)}`;$('#apoc-timer').textContent=st.deadline?`剩 ${Math.max(0,Math.ceil((st.deadline-now)/1000))} 秒`:''}
 else{b.querySelector('.hpbar i').style.width='100%';$('#apoc-hp').textContent=state.need?`血量 ${fmt(state.need)}`:'';const cd=Math.max(0,Math.ceil(((state.cooldownUntil||0)-now)/1000));$('#apoc-timer').textContent=cd&&!state.canFight?`冷卻 ${cd} 秒`:'';$('#apoc-fight').disabled=!state.canFight||!(state.power>0);$('#apoc-fight').textContent=state.power>0?(state.progress%4===3?'挑戰王關':'開戰'):'先去編隊'}
 if(onCurrent){const st0=$('#status');if(st0&&st0.textContent.includes('記錄'))st0.textContent='目前位置';const nx=$('#next');if(nx)nx.textContent=st?(st.deadline?'王關：時間內打倒。護盾要靠點擊破，破防那幾秒全傷害 ×2':'戰鬥中：點「攻擊！」，放著隊伍也會打'):(state.canFight?'按「開戰」開始；打不死就過不去，沒有其他懲罰':'')}
 renderShield(st,now);renderSkills(now);
 b.querySelector('.power').textContent=`隊伍每秒戰力 ${fmt(state.power||0)}・點一下 ${fmt((state.power||0)*.5)}・放置每秒 +${((state.power||0)*.01).toFixed(1)} 金幣`}
// 王關的護盾與節奏：護盾在場時放置只剩三成五，點擊照常並累積破盾進度；破防 8 秒全傷害 ×2
function renderShield(st,now){const bar=$('#apoc-shield'),txt=$('#apoc-shieldtext'),on=!!(st&&st.boss);bar.hidden=txt.hidden=!on;if(!on)return;
 const broken=now<(st.breakUntil||0);bar.classList.toggle('broken',broken);
 if(broken){txt.textContent=`破防！全傷害 ×2・剩 ${Math.max(0,Math.ceil((st.breakUntil-now)/1000))} 秒`;return}
 const sh=st.shield||{taps:0,need:1};bar.querySelector('i').style.width=Math.min(100,sh.taps/sh.need*100)+'%';
 txt.textContent=`護盾：再點 ${Math.max(0,sh.need-sh.taps)} 下破盾（護盾在場時放置只有三成五）`}
function renderSkills(now){const box=$('#apoc-skills'),defs=state.skillDefs||[null,null,null,null],cds=state.skillCd||[0,0,0,0];
 if(box.children.length!==4){box.replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('button');b.dataset.slot=i;b.onclick=()=>parent.postMessage({type:'apoc-skill',slot:i},'*');box.append(b)}}
 for(let i=0;i<4;i++){const b=box.children[i],d=defs[i],left=Math.max(0,Math.ceil(((cds[i]||0)-now)/1000)),ready=!!d&&!left&&!!state.stage;
  b.innerHTML=d?`<b>${d.name}</b><small>${left?left+' 秒':d.text}</small>`:`<b>技能 ${i+1}</b><small>未指派</small>`;
  b.disabled=!ready;b.dataset.ready=String(ready);b.title=d?`${d.card}・${d.text}`:'到編隊把卡放進獨立技能格'}}
function syncTeam(){const t=window.team20;if(!t||!state.owned)return;const cc=$('#apoc-collection-count');if(cc)cc.textContent=`收藏 ${state.owned.length} / ${t.cards.length} 張`;const key=JSON.stringify([state.owned,state.roster,state.skills,state.collection]);if(key===teamKey)return;teamKey=key;t.setOwned(state.owned);t.setStars?.(state.collection||{});t.setRoster(state.roster||[]);t.setSkills(state.skills||[])}
window.onTeamChange=()=>{const t=window.team20;if(!t)return;teamKey='';parent.postMessage({type:'apoc-team',roster:t.roster,skills:t.skills},'*')};
function syncGacha(){const f=$('#gacha-screen iframe');if(f&&f.contentWindow)try{f.contentWindow.postMessage({type:'apoc-tickets',tickets:state.tickets||0},'*')}catch{}}
$('#apoc-buy').onclick=()=>parent.postMessage({type:'apoc-buy-ticket',n:1},'*');
function renderCollect(){const g=$('#collect-grid');g.replaceChildren();const ids=(state.collectibles||[]).filter(id=>COLLECT[id]);
 if(!ids.length){const p=document.createElement('p');p.className='collect-empty';p.textContent='還沒有收藏卡。';g.append(p);return}
 for(const id of ids){const b=document.createElement('button');b.className='collect-card';b.style.backgroundImage=`url("${COLLECT[id].thumb}")`;b.innerHTML=`<b>${COLLECT[id].name}</b>`;b.title=COLLECT[id].name+'・點開看精裝卡';b.onclick=()=>{const v=$('#collect-view');v.querySelector('iframe').src=COLLECT[id].page;v.hidden=false};g.append(b)}}
$('#collect-close').onclick=()=>{const v=$('#collect-view');v.hidden=true;v.querySelector('iframe').src='about:blank'};
function go(tab){for(const b of document.querySelectorAll('.apoc-nav button'))b.setAttribute('aria-current',String(b.dataset.go===tab));
 $('#gacha-screen').hidden=tab!=='gacha';if(tab==='gacha'){const f=$('#gacha-screen iframe');if(!f.src||f.src==='about:blank')f.src='gacha.html'}
 if(tab==='map')window.team20?.setScreen('map');if(tab==='team'||tab==='collect'){window.team20?.setScreen('team');if(tab==='collect')setTimeout(()=>$('.team-collect')?.scrollIntoView({behavior:'smooth',block:'start'}),60)}
 parent.postMessage({type:'apoc-tab',tab},'*')}
document.querySelectorAll('.apoc-nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$('#apoc-back').onclick=()=>parent.postMessage({type:'apoc-back'},'*');
addEventListener('message',e=>{const d=e.data||{};if(d.type==='apoc-state'){state={...state,...d.state};renderTop();renderCollect();renderBattle();syncTeam();syncGacha()}
 else if(d.type==='apoc-go')go(d.tab)
 else if(d.type==='apoc-win'){window.map20?.advance()}
 else if(d.type==='apoc-drawn'){parent.postMessage(d,'*')}});
$('#gacha-screen iframe').addEventListener('load',syncGacha);
setInterval(()=>{if(document.body.dataset.screen!=='team')renderBattle()},500);
renderTop();renderCollect();parent.postMessage({type:'apoc-ready'},'*');
window.apocShell={go,get state(){return state}};
})();
</script>
